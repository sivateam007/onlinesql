services:
  - type: web
    name: onlinesql
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: onlinesql-db
          property: connectionString

databases:
  - name: onlinesql-db
    plan: free
